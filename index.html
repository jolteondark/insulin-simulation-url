<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f2f4f7" />
<title>WARD GLUCOSE — Inpatient Insulin Simulation</title>
<link rel="stylesheet" href="style.css?v=20260818-1729" />
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div>
      <div class="eyebrow">INPATIENT GLUCOSE SIMULATION</div>
      <h1>WARD GLUCOSE</h1>
    </div>
    <div class="day-pill">DAY <span id="dayNo">1</span></div>
  </header>
  <main>
    <section class="patient-card">
      <div class="patient-head">
        <div>
          <div class="case-line"><span id="caseId">GENERATING</span></div>
          <div class="phenotype-line"><span id="phenotype">1型糖尿病</span></div>
          <div id="contextBadges" class="badges"></div>
        </div>
        <button id="newCaseBtn" class="ghost-btn">患者変更</button>
      </div>
      <div class="rule-line"><b>GOAL</b> 70未満 / 400超で終了。安全に安定軌道へ。</div>
    </section>
    <section class="record-card">
      <div class="record-title-row">
        <div><div class="section-kicker">YESTERDAY</div><h2>前日の記録</h2></div>
        <div class="record-caption">4検・食事・前医処方</div>
      </div>
      <div class="time-head"><div></div><div>朝</div><div>昼</div><div>夕</div><div>眠前</div></div>
      <div class="record-row"><div class="row-label">血糖</div><div id="bgGrid" class="record-values bg-grid"></div></div>
      <div class="record-row"><div class="row-label">食事</div><div id="mealGrid" class="record-values meal-grid"></div></div>
      <div class="record-row last"><div class="row-label">Ins</div><div id="prevDoseGrid" class="record-values dose-summary"></div></div>
      <div class="micro-note">食事は前日の実摂取量。今日の実摂取量は処方時点では分かりません。</div>
    </section>
    <section class="order-card">
      <div class="order-head"><div><div class="section-kicker">TODAY</div><h2>今日の処方</h2></div><div class="order-note">整数 U</div></div>
      <div id="doseGrid" class="dose-grid"></div>
      <button id="submitBtn" class="primary-btn">この処方で1日進める</button>
    </section>
    <section id="resultPanel" class="result-panel hidden" aria-live="polite"></section>
  </main>
  <footer>Educational simulation only — not for clinical dosing.</footer>
</div>
<script src="engine.js?v=20260818-1729"></script>
<script src="patient_generator.js?v=20260818-1729"></script>
<script src="app.js?v=20260818-1729"></script>
</body>
</html>
