name: component-pattern-transient-correction-split
on:
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run component-pattern transient correction split audit
        run: node scripts/audit_component_pattern_transient_correction_split.js
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-pattern-transient-correction-split
          path: |
            analysis/component_pattern_transient_correction_split/results.json
            analysis/component_pattern_transient_correction_split/report.md
