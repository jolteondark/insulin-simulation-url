name: diatec-stress-decay-attribution
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run DIATEC stress-decay causal attribution
        run: node scripts/audit_diatec_stress_decay_attribution.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diatec-stress-decay-attribution
          path: |
            analysis/diatec_stress_decay_attribution/results.json
            analysis/diatec_stress_decay_attribution/report.md
