name: Emory inpatient trajectory heterogeneity
on:
  workflow_dispatch:
  push:
    branches: [v2/state-space-minimal]
    paths:
      - 't2dm_inpatient_trajectory_v1_exp.js'
      - 't2dm_patient_phenotype_v3_inpatient_mix_exp.js'
      - 't2dm_treatment_policy_weight_bg_exp.js'
      - 't2dm_inpatient_dynamic_v1_exp.js'
      - 't2dm_inpatient_course_v1_exp.js'
      - 'insulin_prandial_pk_prior_ranges_exp.js'
      - 'scripts/validate_emory_trajectory_heterogeneity.js'
      - '.github/workflows/emory-trajectory-heterogeneity.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/state-space-minimal
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/validate_emory_trajectory_heterogeneity.js
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis/emory_trajectory_heterogeneity
          git diff --cached --quiet || git commit -m 'Update Emory trajectory heterogeneity validation'
          git push origin HEAD:v2/state-space-minimal
