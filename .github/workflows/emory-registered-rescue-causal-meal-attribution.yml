name: emory-registered-rescue-causal-meal-attribution
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run causal meal attribution
        run: node scripts/audit_emory_registered_rescue_causal_meal_attribution.js
      - uses: actions/upload-artifact@v4
        with:
          name: emory-registered-rescue-causal-meal-attribution
          path: |
            analysis/emory_registered_rescue_causal_meal_attribution/results.json
            analysis/emory_registered_rescue_causal_meal_attribution/report.md
