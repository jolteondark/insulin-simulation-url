name: External Emory basal-bolus validation
on:
  push:
    branches: [v2/state-space-minimal]
    paths:
      - 'scripts/external_validate_emory_basal_bolus.js'
      - '.github/workflows/external-emory-basal-bolus.yml'
      - 't2dm_patient_phenotype_v1_shanghai_exp.js'
      - 't2dm_patient_phenotype_v2_shanghai106_exp.js'
      - 't2dm_game_model_v2_order_decomp_exp.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/state-space-minimal
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/external_validate_emory_basal_bolus.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis/external_emory_basal_bolus
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Store external Emory basal-bolus validation'
          git push origin HEAD:v2/state-space-minimal
