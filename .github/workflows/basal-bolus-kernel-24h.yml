name: Basal-bolus kernel 24h grid
on:
  push:
    branches: [v2/state-space-minimal]
    paths:
      - 'scripts/grid_basal_bolus_kernel_24h.js'
      - '.github/workflows/basal-bolus-kernel-24h.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/state-space-minimal
      - run: node scripts/grid_basal_bolus_kernel_24h.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis/basal_bolus_kernel_24h
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Store basal-bolus 24h kernel grid'
          git push origin HEAD:v2/state-space-minimal
