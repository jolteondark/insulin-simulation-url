name: T1DM daytime variability memory screen
on:
  push:
    branches: [validation/azt1d-acf-20260819]
  pull_request:
    branches: [main]
    paths: ['.github/workflows/azt1d-daytime-variability-screen.yml']
permissions: {contents: read}
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm');let E=fs.readFileSync('engine.js','utf8');const G=fs.readFileSync('patient_generator.js','utf8');
          const mealLine='const mealEvents=[[MEAL_TIMES[0],mealPlan.breakfast*intake.breakfast],[MEAL_TIMES[1],mealPlan.lunch*intake.lunch],[MEAL_TIMES[2],mealPlan.dinner*intake.dinner]];';
          const bolLine='const bolusEvents=[[RAPID_TIMES[0],rapidOrder.breakfast_u],[RAPID_TIMES[1],rapidOrder.lunch_u],[RAPID_TIMES[2],rapidOrder.dinner_u]];';
          if(!E.includes(mealLine)||!E.includes(bolLine))throw Error('timing signatures');
          E=E.replace(mealLine,"const __mt=ctx.meal_times_min||MEAL_TIMES,__rt=ctx.rapid_times_min||RAPID_TIMES;const mealEvents=[[__mt[0],mealPlan.breakfast*intake.breakfast],[__mt[1],mealPlan.lunch*intake.lunch],[__mt[2],mealPlan.dinner*intake.dinner]];").replace(bolLine,'const bolusEvents=[[__rt[0],rapidOrder.breakfast_u],[__rt[1],rapidOrder.lunch_u],[__rt[2],rapidOrder.dinner_u]];');
          const BASE=[480,780,1140],L=[30,60,120,240],N=80,DAYS=14;
          const TARGET={all:{30:.8627021804,60:.6351287169,120:.2184468350,240:.0073117640},night:{30:.8891512220,60:.7603847340,120:.4601047466,240:.0859252316},day:{30:.8356734642,60:.5790031609,120:.1024831789,240:-.0541005771}};
          function context(src){const c={console,Float64Array,Math,Number,String,Object,Array,JSON,Date,Set,Map};c.window=c;c.globalThis=c;vm.createContext(c);vm.runInContext(src,c);return c}
          const b=context(fs.readFileSync('engine.js','utf8'));vm.runInContext(G,b);const cohort=[];for(let i=0;i<N;i++){const seed=960001+i,x=b.PatientGenerator.generate(seed);cohort.push({seed,p:structuredClone(x.patient),c:structuredClone(x.case)})}
          function rng(seed){let a=seed>>>0;return()=>{let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
          function cor(a,b){const n=a.length;if(n<50)return NaN;let sx=0,sy=0,sxx=0,syy=0,sxy=0;for(let i=0;i<n;i++){let x=a[i],y=b[i];sx+=x;sy+=y;sxx+=x*x;syy+=y*y;sxy+=x*y}return(n*sxy-sx*sy)/Math.sqrt((n*sxx-sx*sx)*(n*syy-sy*sy))}function med(a){a=a.filter(Number.isFinite).sort((x,y)=>x-y);return a.length%2?a[(a.length-1)/2]:(a[a.length/2-1]+a[a.length/2])/2}
          function settings(kind,seed,day){const r=rng((seed+day*10007)>>>0);let mt=[...BASE],lead=[-15,-15,-15],mult=[1,1,1];if(kind==='meal_jitter30'||kind==='all'){mt=mt.map(x=>x+(r()*60-30))}if(kind==='lead_jitter'||kind==='all'){lead=lead.map(()=>-30+r()*45)}if(kind==='carb20'||kind==='all'){mult=mult.map(()=>.8+r()*.4)}return{mt,rt:mt.map((x,i)=>x+lead[i]),mult}}
          function run(kind){const q=context(E),acfAll=Object.fromEntries(L.map(l=>[l,[]])),acfNight=Object.fromEntries(L.map(l=>[l,[]])),acfDay=Object.fromEntries(L.map(l=>[l,[]]));let n=0,sum=0,sum2=0,tir=0,lo=0,hi=0;for(const z of cohort){let start=z.c.previous_day_end_glucose_mg_dl,series=[];for(let d=0;d<DAYS;d++){const s=settings(kind,z.seed,d),cc=structuredClone(z.c);cc.meal_times_min=s.mt;cc.rapid_times_min=s.rt;cc.meal_plan_carb_g={breakfast:50*s.mult[0],lunch:70*s.mult[1],dinner:60*s.mult[2]};const o=cc.previous_order_u,r=q.GlucoseEngine.simulate(z.p,cc,{breakfast_u:o.breakfast_u,lunch_u:o.lunch_u,dinner_u:o.dinner_u},o.basal_u,z.seed+d*997,start);start=r.end;for(let t=0;t<1440;t+=5)series.push({g:r.series[t],tod:t});}
            for(const l of L){const k=l/5,a=[],bb=[],an=[],bn=[],ad=[],bd=[];for(let i=0;i+k<series.length;i++){const x=series[i],y=series[i+k];a.push(x.g);bb.push(y.g);if(x.tod<360&&y.tod<360){an.push(x.g);bn.push(y.g)}if(x.tod>=360&&y.tod>=360){ad.push(x.g);bd.push(y.g)}}acfAll[l].push(cor(a,bb));acfNight[l].push(cor(an,bn));acfDay[l].push(cor(ad,bd));}
            for(const x of series){const g=x.g;n++;sum+=g;sum2+=g*g;if(g>=70&&g<=180)tir++;if(g<70)lo++;if(g>180)hi++;}}
            const m=sum/n,sd=Math.sqrt((sum2-sum*sum/n)/(n-1)),A={all:Object.fromEntries(L.map(l=>[l,med(acfAll[l])])),night:Object.fromEntries(L.map(l=>[l,med(acfNight[l])])),day:Object.fromEntries(L.map(l=>[l,med(acfDay[l])]))};let e=0,cnt=0;for(const sc of ['all','night','day'])for(const l of L){e+=(A[sc][l]-TARGET[sc][l])**2;cnt++}return{kind,acf:A,daypart_rmse:Math.sqrt(e/cnt),mean:m,sd,cv:100*sd/m,TIR:100*tir/n,TBR70:100*lo/n,TAR180:100*hi/n}}
          const R=['baseline','meal_jitter30','lead_jitter','carb20','all'].map(run);fs.writeFileSync('daytime-variability.json',JSON.stringify({target:TARGET,results:R},null,2));console.log('DAYTIME_VARIABILITY_BEGIN');console.log(JSON.stringify({target:TARGET,results:R},null,2));console.log('DAYTIME_VARIABILITY_END');
          JS
      - uses: actions/upload-artifact@v4
        with: {name: daytime-variability-screen, path: daytime-variability.json}
