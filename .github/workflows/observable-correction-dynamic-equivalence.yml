name: observable-correction-dynamic-equivalence
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run observable correction derivative equivalence audit
        run: node scripts/audit_observable_correction_dynamic_equivalence.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observable-correction-dynamic-equivalence
          path: analysis/observable_correction_dynamic_equivalence/results.json
