name: combined-policy-residual-tail-attribution
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run combined-policy residual tail attribution
        run: node scripts/audit_combined_policy_residual_tail_attribution.js
      - uses: actions/upload-artifact@v4
        with:
          name: combined-policy-residual-tail-attribution
          path: |
            analysis/combined_policy_residual_tail_attribution/results.json
            analysis/combined_policy_residual_tail_attribution/report.md
