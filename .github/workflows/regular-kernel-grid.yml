name: Regular insulin kernel grid
on:
  push:
    branches: [v2/state-space-minimal]
    paths:
      - 'scripts/grid_regular_kernel.js'
      - '.github/workflows/regular-kernel-grid.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/state-space-minimal
      - run: node scripts/grid_regular_kernel.js
      - name: Persist results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis/regular_kernel_grid
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Store regular-insulin kernel grid'
          git push origin HEAD:v2/state-space-minimal
