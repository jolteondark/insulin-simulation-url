name: resolving-component-titration-ablation
on:
  push:
    branches: [v2/state-space-minimal]
    paths:
      - 'scripts/audit_resolving_component_titration_ablation.js'
      - '.github/workflows/resolving-component-titration-ablation.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run resolving component titration ablation
        run: node scripts/audit_resolving_component_titration_ablation.js
      - uses: actions/upload-artifact@v4
        with:
          name: resolving-component-titration-ablation
          path: |
            analysis/resolving_component_titration_ablation/results.json
            analysis/resolving_component_titration_ablation/report.md
