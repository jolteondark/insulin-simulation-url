name: diatec-poc-exposure-trajectory
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run DIATEC POC exposure trajectory diagnostic
        run: node scripts/audit_diatec_poc_exposure_trajectory.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diatec-poc-exposure-trajectory
          path: |
            analysis/diatec_poc_exposure_trajectory/results.json
            analysis/diatec_poc_exposure_trajectory/report.md
