name: Model patient meal response
on:
  push:
    branches: [v2/state-space-minimal]
    paths:
      - 'scripts/validate_model_patient_meal_response.js'
      - '.github/workflows/model-patient-meal-response.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/state-space-minimal
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run validation
        run: node scripts/validate_model_patient_meal_response.js
      - name: Persist results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis/model_patient_meal_response
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Store model patient meal-response validation'
          git push origin HEAD:v2/state-space-minimal
