name: Strict regular correction-dose audit
on:
  push:
    branches: [v2/state-space-minimal]
    paths:
      - 'scripts/audit_strict_regular_correction_doses.py'
      - '.github/workflows/strict-regular-correction-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/state-space-minimal
      - run: |
          git clone --quiet https://github.com/MouzKarrigan/2024_TJU_Data_Mining-Analysis.git /tmp/tju
          cd /tmp/tju
          git checkout --quiet cf5e7f32e8f8295e49df27ea70d9d6b21ab30598
      - run: python3 scripts/audit_strict_regular_correction_doses.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis/shanghai_strict_regular_correction_audit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Store strict regular correction-dose audit'
          git push origin HEAD:v2/state-space-minimal
