name: v2-validation
on:
  push:
    branches: [v2/state-space-minimal]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run wide biphasic basal requirement state grid
        run: node validation_v083_biphasic_requirement_state_wide_node.js
      - uses: actions/upload-artifact@v4
        with:
          name: v083-biphasic-wide-result
          path: v083_biphasic_requirement_state_wide_result.json
