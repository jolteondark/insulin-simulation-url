name: v2-validation
on:
  push:
    branches: [v2/state-space-minimal]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run v0.82 ACF component attribution
        run: node validation_v082_acf_component_ablation_node.js
      - uses: actions/upload-artifact@v4
        with:
          name: v082-acf-component-result
          path: v082_acf_component_ablation_result.json
