name: v2-validation
on:
  push:
    branches: [v2/state-space-minimal]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run v0.82 integrated transient candidate
        run: node validation_generator_v082_integrated_transient_node.js
      - uses: actions/upload-artifact@v4
        with:
          name: generator-v082-integrated-result
          path: generator_v082_integrated_transient_result.json
