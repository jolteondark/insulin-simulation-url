name: v2-validation
on:
  push:
    branches: [v2/state-space-minimal]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run S_I primitive reparameterization diagnostic
        run: node validation_si_primitive_reparameterization_node.js
      - uses: actions/upload-artifact@v4
        with:
          name: si-primitive-reparameterization-result
          path: si_primitive_reparameterization_result.json
