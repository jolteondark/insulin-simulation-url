name: v2-validation
on:
  push:
    branches: [v2/state-space-minimal]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run held-out fingerprint validation
        run: N=300 node validation_v089_heldout_fingerprint_node.js
      - uses: actions/upload-artifact@v4
        with:
          name: v089-heldout-fingerprint-result
          path: v089_heldout_fingerprint_result.json
