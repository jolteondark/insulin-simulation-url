name: v2-validation
on:
  push:
    branches: [v2/state-space-minimal]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run extended biphasic requirement-state grid
        run: node validation_v086_extended_biphasic_state_node.js
      - uses: actions/upload-artifact@v4
        with:
          name: v086-extended-biphasic-result
          path: v086_extended_biphasic_state_result.json
