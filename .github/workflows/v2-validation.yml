name: v2-validation
on:
  push:
    branches: [v2/state-space-minimal]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run rescue behavior ablation
        run: N=180 node validation_v093_behavior_rescue_ablation_node.js
      - uses: actions/upload-artifact@v4
        with:
          name: v093-behavior-rescue-result
          path: v093_behavior_rescue_ablation_result.json
