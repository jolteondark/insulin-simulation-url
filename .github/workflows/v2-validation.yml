name: v2-validation
on:
  push:
    branches: [v2/state-space-minimal]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run N300 biphasic finalist validation
        run: N=300 node validation_v088_n300_biphasic_finalists_node.js
      - uses: actions/upload-artifact@v4
        with:
          name: v088-n300-biphasic-finalists-result
          path: v088_n300_biphasic_finalists_result.json
