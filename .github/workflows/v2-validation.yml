name: v2-validation
on:
  push:
    branches: [v2/state-space-minimal]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run short-slow zero-area transient grid
        run: node validation_short_slow_zero_area_transient_node.js
      - uses: actions/upload-artifact@v4
        with:
          name: short-slow-zero-area-transient-result
          path: short_slow_zero_area_transient_result.json
