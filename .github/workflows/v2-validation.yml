name: v2-validation
on:
  push:
    branches: [v2/state-space-minimal]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run v0.80 nested TDD models
        run: node validation_v080_tdd_nested_models_node.js
      - uses: actions/upload-artifact@v4
        with:
          name: v080-tdd-nested-result
          path: v080_tdd_nested_models_result.json
