name: v2-validation
on:
  push:
    branches: [v2/state-space-minimal]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run persistent memory-shape validation
        run: node validation_persistent_memory_shape_node.js
      - uses: actions/upload-artifact@v4
        with:
          name: persistent-memory-shape-result
          path: persistent_memory_shape_result.json
