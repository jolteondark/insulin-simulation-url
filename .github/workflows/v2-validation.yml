name: v2-validation
on:
  push:
    branches: [v2/state-space-minimal]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run two-component basal requirement state grid
        run: node validation_v084_two_component_requirement_state_node.js
      - uses: actions/upload-artifact@v4
        with:
          name: v084-two-component-state-result
          path: v084_two_component_requirement_state_result.json
