name: v2-validation
on:
  push:
    branches: [v2/state-space-minimal]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run meal intake variability validation
        run: N=180 node validation_v094_meal_intake_variability_node.js
      - uses: actions/upload-artifact@v4
        with:
          name: v094-meal-intake-variability-result
          path: v094_meal_intake_variability_result.json
