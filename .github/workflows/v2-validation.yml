name: v2-validation
on:
  push:
    branches: [v2/state-space-minimal]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run cross-dataset biphasic refinement
        run: node validation_v087_crossdataset_biphasic_refine_node.js
      - uses: actions/upload-artifact@v4
        with:
          name: v087-crossdataset-biphasic-result
          path: v087_crossdataset_biphasic_refine_result.json
