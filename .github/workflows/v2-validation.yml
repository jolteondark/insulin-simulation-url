name: v2-validation
on:
  push:
    branches: [v2/state-space-minimal]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run v0.81 S_I plus demand generator candidate
        run: node validation_generator_v081_si_demand_node.js
      - uses: actions/upload-artifact@v4
        with:
          name: generator-v081-si-demand-result
          path: generator_v081_si_demand_result.json
