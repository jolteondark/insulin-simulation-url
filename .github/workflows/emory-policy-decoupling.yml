name: Emory policy decoupling
on:
  push:
    branches: [v2/state-space-minimal]
    paths:
      - 'scripts/validate_emory_policy_decoupling.js'
      - 't2dm_treatment_policy_weight_bg_exp.js'
      - '.github/workflows/emory-policy-decoupling.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/state-space-minimal
      - run: node scripts/validate_emory_policy_decoupling.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis/emory_policy_decoupling
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Store Emory policy-decoupling validation'
          git push origin HEAD:v2/state-space-minimal
