name: counterregulation-smooth-handoff
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run smooth-handoff counterregulation audit
        run: node scripts/audit_counterregulation_smooth_handoff.js
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counterregulation-smooth-handoff
          path: |
            analysis/counterregulation_smooth_handoff/results.json
            analysis/counterregulation_smooth_handoff/report.md
