name: T2DM V3 renal direction audit
on:
  workflow_dispatch:
  push:
    branches: [v2/state-space-minimal]
    paths:
      - 't2dm_renal_insulin_modifier_v1_exp.js'
      - 't2dm_treatment_policy_weight_bg_exp.js'
      - 't2dm_inpatient_dynamic_v1_exp.js'
      - 't2dm_inpatient_course_v1_exp.js'
      - 't2dm_patient_phenotype_v3_inpatient_mix_exp.js'
      - 'scripts/audit_t2dm_v3_renal_direction.js'
      - '.github/workflows/t2dm-v3-renal-direction.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/state-space-minimal
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/audit_t2dm_v3_renal_direction.js
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis/t2dm_v3_renal_direction
          git diff --cached --quiet || git commit -m 'Update T2DM V3 renal direction audit'
          git push origin HEAD:v2/state-space-minimal
