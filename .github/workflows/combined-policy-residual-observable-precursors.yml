name: combined-policy-residual-observable-precursors
on:
  push:
    branches: [v2/state-space-minimal]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run residual observable precursor audit
        run: node scripts/audit_combined_policy_residual_observable_precursors.js
      - uses: actions/upload-artifact@v4
        with:
          name: combined-policy-residual-observable-precursors
          path: |
            analysis/combined_policy_residual_observable_precursors/results.json
            analysis/combined_policy_residual_observable_precursors/report.md
