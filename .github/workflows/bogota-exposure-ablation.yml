name: bogota-exposure-ablation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Bogotá treatment-exposure causal ablation
        run: node scripts/audit_bogota_exposure_ablation.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bogota-exposure-ablation
          path: |
            analysis/bogota_exposure_ablation/results.json
            analysis/bogota_exposure_ablation/report.md
