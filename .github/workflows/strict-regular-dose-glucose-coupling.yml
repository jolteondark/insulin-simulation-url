name: Strict regular dose-glucose coupling
on:
  push:
    branches: [v2/state-space-minimal]
    paths:
      - 'scripts/analyze_strict_regular_dose_glucose_coupling.py'
      - '.github/workflows/strict-regular-dose-glucose-coupling.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/state-space-minimal
      - run: python3 scripts/analyze_strict_regular_dose_glucose_coupling.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis/shanghai_strict_regular_dose_glucose_coupling
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Store strict regular dose-glucose coupling analysis'
          git push origin HEAD:v2/state-space-minimal
