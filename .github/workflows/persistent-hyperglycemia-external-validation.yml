name: persistent-hyperglycemia-external-validation
on:
  pull_request:
    paths:
      - 'scripts/audit_persistent_hyperglycemia_external_validation.js'
      - '.github/workflows/persistent-hyperglycemia-external-validation.yml'
      - 't2dm_patient_phenotype_v1_shanghai_exp.js'
      - 't2dm_patient_phenotype_v2_shanghai106_exp.js'
      - 't2dm_patient_phenotype_v3_inpatient_mix_exp.js'
      - 't2dm_game_model_v2_order_decomp_exp.js'
      - 't2dm_inpatient_dynamic_v1_exp.js'
      - 't2dm_inpatient_course_v1_exp.js'
      - 't2dm_treatment_policy_weight_bg_exp.js'
      - 'insulin_prandial_pk_prior_ranges_exp.js'
      - 't2dm_inpatient_trajectory_v1_exp.js'
      - 'insulin_basal_potency_prior_exp.js'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run full external validation
        run: node scripts/audit_persistent_hyperglycemia_external_validation.js
      - uses: actions/upload-artifact@v4
        with:
          name: persistent-hyperglycemia-external-validation
          path: |
            analysis/persistent_hyperglycemia_external_validation/results.json
            analysis/persistent_hyperglycemia_external_validation/report.md
