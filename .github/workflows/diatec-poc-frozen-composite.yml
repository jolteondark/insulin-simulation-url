name: diatec-poc-frozen-composite
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run DIATEC POC frozen-composite external audit
        run: node scripts/audit_diatec_poc_frozen_composite.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diatec-poc-frozen-composite
          path: |
            analysis/diatec_poc_frozen_composite/results.json
            analysis/diatec_poc_frozen_composite/report.md
