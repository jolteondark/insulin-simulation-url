name: AZT1D independent autocorrelation validation

on:
  push:
    branches:
      - validation/azt1d-acf-20260819
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/azt1d-acf-validation.yml'

permissions:
  contents: read

jobs:
  azt1d-acf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout frozen model ref
        uses: actions/checkout@v4
      - name: Run strict AZT1D CGM analysis
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, datetime as dt, hashlib, io, json, math, statistics, urllib.request, zipfile
          from pathlib import Path

          URL = "https://raw.githubusercontent.com/Augmented-Health-Lab/Glucose-ML-Project/main/3_Glucose-ML-collection/AZT1D/AZT1D-from-Glucose-ML.zip"
          MODEL = {30: 0.787, 60: 0.345, 120: -0.425, 240: -0.166}
          T1D_UOM = {60: 0.634, 120: 0.247}
          LAGS = (30, 60, 120, 240)

          def pearson(xs, ys):
              n = len(xs)
              if n < 50:
                  return None
              sx = sum(xs); sy = sum(ys)
              sxx = sum(x*x for x in xs); syy = sum(y*y for y in ys)
              sxy = sum(x*y for x,y in zip(xs,ys))
              vx = n*sxx - sx*sx; vy = n*syy - sy*sy
              if vx <= 0 or vy <= 0:
                  return None
              return (n*sxy - sx*sy) / math.sqrt(vx*vy)

          def classify(delta):
              a = abs(delta)
              return "PASS" if a <= 0.10 else ("MINOR" if a <= 0.20 else "MATERIAL")

          def parse_time(s):
              s = s.strip().replace('Z','+00:00')
              try:
                  return dt.datetime.fromisoformat(s)
              except Exception:
                  for fmt in ("%Y-%m-%d %H:%M:%S", "%Y-%m-%dT%H:%M:%S"):
                      try: return dt.datetime.strptime(s, fmt)
                      except Exception: pass
              raise ValueError(s)

          req = urllib.request.Request(URL, headers={"User-Agent":"Mozilla/5.0"})
          raw = urllib.request.urlopen(req, timeout=120).read()
          sha256 = hashlib.sha256(raw).hexdigest()
          z = zipfile.ZipFile(io.BytesIO(raw))
          members = [n for n in z.namelist() if n.lower().endswith('.csv') and 'metadata' not in n.lower()]
          if len(members) < 20:
              raise SystemExit(f"expected participant CSVs, found {len(members)}")

          patients = []
          pooled = []
          for member in sorted(members):
              text = z.read(member).decode('utf-8-sig')
              by_time = {}
              for row in csv.DictReader(io.StringIO(text)):
                  if 'timestamp' not in row or 'glucose_value_mg_dl' not in row:
                      continue
                  try:
                      t = parse_time(row['timestamp'])
                      g = float(row['glucose_value_mg_dl'])
                  except Exception:
                      continue
                  if math.isfinite(g):
                      by_time[t] = g
                      pooled.append(g)
              times = sorted(by_time)
              acf = {}; pairs = {}
              for lag in LAGS:
                  xs=[]; ys=[]; delta=dt.timedelta(minutes=lag)
                  for t in times:
                      t2=t+delta
                      if t2 in by_time:
                          xs.append(by_time[t]); ys.append(by_time[t2])
                  acf[str(lag)] = pearson(xs,ys)
                  pairs[str(lag)] = len(xs)
              patients.append({"patient":Path(member).stem,"n":len(times),"acf":acf,"pairs":pairs})

          def quantile(v,p):
              if len(v)==1:return v[0]
              x=(len(v)-1)*p; lo=math.floor(x); hi=math.ceil(x)
              if lo==hi:return v[lo]
              return v[lo]*(hi-x)+v[hi]*(x-lo)

          med = {}; q25 = {}; q75 = {}
          for lag in LAGS:
              vals = sorted(p['acf'][str(lag)] for p in patients if p['acf'][str(lag)] is not None)
              med[str(lag)] = statistics.median(vals)
              q25[str(lag)] = quantile(vals,.25); q75[str(lag)] = quantile(vals,.75)

          mean = statistics.fmean(pooled); sd = statistics.stdev(pooled)
          ranges = {
              "TIR_70_180_percent":100*sum(70 <= g <= 180 for g in pooled)/len(pooled),
              "TBR_lt70_percent":100*sum(g < 70 for g in pooled)/len(pooled),
              "TBR_lt54_percent":100*sum(g < 54 for g in pooled)/len(pooled),
              "TAR_gt180_percent":100*sum(g > 180 for g in pooled)/len(pooled),
              "TAR_gt250_percent":100*sum(g > 250 for g in pooled)/len(pooled),
          }
          comparisons = {}
          for lag in LAGS:
              obs=med[str(lag)]; delta=obs-MODEL[lag]
              comparisons[str(lag)]={"observed":obs,"model":MODEL[lag],"delta_observed_minus_model":delta,"class":classify(delta)}

          same_direction = comparisons['60']['delta_observed_minus_model'] > 0.20 and comparisons['120']['delta_observed_minus_model'] > 0.20
          out = {
              "status":"SECOND_INDEPENDENT_COHORT_ANALYZED_FROM_PUBLIC_HARMONIZED_CGM",
              "source":"Glucose-ML harmonized AZT1D participant CSVs; original AZT1D CC BY 4.0",
              "source_zip_sha256":sha256,"patients":len(patients),"cgm_points":len(pooled),
              "method":"exact timestamp pairs at 30/60/120/240 min; no interpolation performed by this analysis",
              "caveat":"harmonized derivative, not official raw AZT1D archive; formal raw Tier-A status remains separate",
              "mean_mg_dL":mean,"sd_mg_dL":sd,"cv_percent":100*sd/mean,
              **ranges,"patient_median_acf":med,"patient_acf_q25":q25,"patient_acf_q75":q75,
              "comparison_vs_frozen_model":comparisons,"T1D_UOM_reference":T1D_UOM,
              "short_memory_same_direction_replication":same_direction,"per_patient":patients,
          }
          Path('azt1d-acf-result.json').write_text(json.dumps(out, indent=2), encoding='utf-8')
          print('AZT1D_VALIDATION_RESULT_BEGIN')
          print(json.dumps({k:v for k,v in out.items() if k!='per_patient'}, indent=2))
          print('AZT1D_VALIDATION_RESULT_END')
          PY
      - name: Upload validation result
        uses: actions/upload-artifact@v4
        with:
          name: azt1d-acf-result
          path: azt1d-acf-result.json
