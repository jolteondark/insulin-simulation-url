name: same-day-poc-prandial-safety-audit
on:
  pull_request:
    paths:
      - 't2dm_inpatient_dynamic_v1_poc_safety_exp.js'
      - 'scripts/audit_same_day_poc_prandial_safety.js'
      - '.github/workflows/same-day-poc-prandial-safety-audit.yml'
      - 't2dm_inpatient_course_v1_exp.js'
      - 't2dm_treatment_policy_weight_bg_exp.js'
      - 't2dm_patient_phenotype_v1_shanghai_exp.js'
      - 't2dm_patient_phenotype_v3_inpatient_mix_exp.js'
      - 't2dm_inpatient_trajectory_v1_exp.js'
      - 'insulin_basal_potency_prior_exp.js'
      - 'insulin_prandial_pk_prior_ranges_exp.js'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run same-day observable POC prandial safety audit
        run: node scripts/audit_same_day_poc_prandial_safety.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: same-day-poc-prandial-safety-audit
          path: |
            analysis/same_day_poc_prandial_safety/results.json
            analysis/same_day_poc_prandial_safety/report.md
