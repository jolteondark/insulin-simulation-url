name: graz-frozen-composite-external
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run frozen composite Graz external validation
        run: node scripts/audit_graz_frozen_composite_external.js
      - uses: actions/upload-artifact@v4
        with:
          name: graz-frozen-composite-external
          path: |
            analysis/graz_2015_frozen_composite_external/results.json
            analysis/graz_2015_frozen_composite_external/report.md
