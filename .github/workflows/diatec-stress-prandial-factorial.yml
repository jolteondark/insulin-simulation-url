name: diatec-stress-prandial-factorial
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run DIATEC stress x prandial-retitration factorial
        run: node scripts/audit_diatec_stress_prandial_factorial.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diatec-stress-prandial-factorial
          path: |
            analysis/diatec_stress_prandial_factorial/results.json
            analysis/diatec_stress_prandial_factorial/report.md
