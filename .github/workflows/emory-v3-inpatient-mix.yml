name: Emory V3 inpatient phenotype validation
on:
  push:
    branches: [v2/state-space-minimal]
    paths:
      - 't2dm_patient_phenotype_v3_inpatient_mix_exp.js'
      - 'scripts/validate_emory_v3_inpatient_mix.js'
      - '.github/workflows/emory-v3-inpatient-mix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/state-space-minimal
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate_emory_v3_inpatient_mix.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis/emory_v3_inpatient_mix
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Store Emory V3 inpatient phenotype validation'
          git push origin HEAD:v2/state-space-minimal
