name: Strict Basal-Regular current model
on:
  push:
    branches: [v2/state-space-minimal]
    paths:
      - 'scripts/validate_strict_basal_regular_current_model.js'
      - '.github/workflows/strict-basal-regular-current-model.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/state-space-minimal
      - run: node scripts/validate_strict_basal_regular_current_model.js
      - name: Persist result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis/strict_basal_regular_current_model
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Store strict Basal-Regular current-model validation'
          git push origin HEAD:v2/state-space-minimal
