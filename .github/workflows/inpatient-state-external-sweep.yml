name: Inpatient state external sweep
on:
  push:
    branches: [v2/state-space-minimal]
    paths:
      - 't2dm_inpatient_state_v1_exp.js'
      - 'scripts/sweep_inpatient_state_external.js'
      - '.github/workflows/inpatient-state-external-sweep.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/state-space-minimal
      - run: node scripts/sweep_inpatient_state_external.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis/inpatient_state_external_sweep
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Store inpatient state external sweep'
          git push origin HEAD:v2/state-space-minimal
