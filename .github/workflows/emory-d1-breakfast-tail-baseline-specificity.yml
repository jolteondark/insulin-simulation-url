name: emory-d1-breakfast-tail-baseline-specificity
on:
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run D1 breakfast tail baseline specificity
        run: node scripts/audit_emory_d1_breakfast_tail_baseline_specificity.js
      - uses: actions/upload-artifact@v4
        with:
          name: emory-d1-breakfast-tail-baseline-specificity
          path: |
            analysis/emory_d1_breakfast_tail_baseline_specificity/results.json
            analysis/emory_d1_breakfast_tail_baseline_specificity/report.md
