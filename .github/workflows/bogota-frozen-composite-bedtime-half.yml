name: bogota-frozen-composite-bedtime-half
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Bogotá frozen-composite validation with bedtime half scale
        run: node scripts/audit_bogota_frozen_composite_external_bedtime_half_fix.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bogota-frozen-composite-bedtime-half
          path: |
            analysis/bogota_frozen_composite_external/results.json
            analysis/bogota_frozen_composite_external/report.md
