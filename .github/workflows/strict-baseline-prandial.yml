name: Strict baseline prandial estimate
on:
  push:
    branches: [v2/state-space-minimal]
    paths:
      - 'scripts/estimate_strict_baseline_prandial.py'
      - '.github/workflows/strict-baseline-prandial.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/state-space-minimal
      - run: python3 scripts/estimate_strict_baseline_prandial.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis/shanghai_strict_baseline_prandial
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Store strict baseline prandial estimate'
          git push origin HEAD:v2/state-space-minimal
